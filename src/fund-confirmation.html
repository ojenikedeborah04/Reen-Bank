<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Transaction complete | Reen Bank</title>
    <link rel="stylesheet" href="./output.css">
  
  </head>
  <body class="m-0 font-sans text-[#252725] antialiased">
    <main
      class="flex min-h-screen items-center justify-center bg-[#d8f3e9] p-5">
      <section
        class="relative w-full max-w-170 rounded-[30px] bg-white p-8 shadow-[0_0_90px_35px_#30b38b50] sm:p-16">
        <a
          href="./dashboard.html"
          class="absolute right-6 top-5 text-xl text-neutral-400"
          aria-label="Close"
          >×</a
        >
        <h2 class="mb-10 text-3xl font-semibold text-[#30b38b]"></h2>
        <div class="py-12">
          <div class="mb-14 text-center text-6xl text-[#30b38b]">✓</div>
          <h1 class="mb-14 text-center text-2xl font-semibold text-neutral-500">
            <span id="amount" class="text-[#30b38b]"></span> has been added to
            your Wallet!
          </h1>
          <a
            href="./accounts.html"
            class="inline-flex items-center justify-center rounded-lg bg-[#30b38b] px-7 py-3 font-semibold text-white hover:bg-[#269775] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#30b38b] transition w-full"
            >Go Back</a
          >
        </div>
        <p id="message" role="status" class="mt-4 text-sm text-[#b73d52]"></p>
        <p class="mt-6 text-xs text-neutral-400">
          Demo only — no real banking actions are performed.
        </p>
      </section>
    </main>
    <script src="./script.js"></script>
    <script src="./fund-confirmation.js"></script>
  </body>
</html>
