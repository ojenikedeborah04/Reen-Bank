<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login | Reen Bank</title>
    <link rel="stylesheet" href="./output.css">
    
    
  </head>
  <body class="m-0 font-sans text-[#252725] antialiased">
    <main
      class="relative min-h-screen overflow-hidden bg-[#d8f3e9] px-6 py-12 lg:px-[6.25%] lg:py-24">
      <img src="./assets/images/background img.jpg" alt="Background Image" class="pointer-events-none absolute inset-0 h-full w-full object-cover opacity-60 mix-blend-multiply"/>
      <div
        class="relative mx-auto grid max-w-[1680px] items-center gap-16 lg:min-h-[75vh] lg:grid-cols-2">
        <section class="flex h-full flex-col justify-between gap-16">
          <a
            href="./index.html"
            class="inline-flex items-center gap-4 text-2xl font-bold whitespace-nowrap"
            aria-label="Reen Bank home">
            <img src="./assets/images/logo.png" alt="Reen Bank logo" class=" object-contain" />
          </a>

          <div>
            <p class="mb-3 text-2xl text-[#30b38b]">Reen Bank</p>
            <h1
              class="text-4xl font-semibold leading-[1.35] tracking-tight xl:text-[60px]"
            >
              Welcome Back
            </h1>
            <p class="mt-8 max-w-160 text-lg leading-relaxed text-neutral-600">
              Enter your details to login to your banking dashboard again!
            </p>
          </div>

          <div class="flex gap-3 text-[#30b38b]" aria-label="Social media">
            <img src="./assets/images/facebook 1.png" alt="Facebook" class="h-9 w-9 object-contain" />
            <img src="./assets/images/instagram 1.png" alt="Instagram" class="h-9 w-9 object-contain" />
            <img src="./assets/images/twitter 1.png" alt="Twitter" class="h-9 w-9 object-contain" />
          </div>
        </section>

        <section
          class="rounded-[28px] bg-white p-7 shadow-[0_0_70px_#30b38b25] sm:p-14"
        >
          <h2 class="mb-10 text-3xl font-semibold text-[#30b38b]">Login</h2>
          <form id="login-form">
            <label class="mb-5 block text-sm font-semibold" for="email">
              Email
              <span class="relative mt-2 block">
                <input
                  class="w-full rounded-xl border border-neutral-400 bg-white px-5 py-4 pr-12 text-sm font-normal shadow-[0_8px_35px_#00000005] outline-none focus:border-[#30b38b] focus:ring-2 focus:ring-[#30b38b]/20"
                  id="email"
                  name="email"
                  type="email"
                  placeholder="Enter your Email"
                  required
                  autocomplete="email" />
                <img
                  class="pointer-events-none absolute right-5 top-1/2 h-5 w-5 -translate-y-1/2"
                  src="./assets/images/fi-rr-envelope.png"
                  alt=""
                  aria-hidden="true" />
              </span>
            </label>
            <label class="mb-5 block text-sm font-semibold" for="password">
              Password
              <span class="relative mt-2 block">
                <input
                  class="w-full rounded-xl border border-neutral-400 bg-white px-5 py-4 pr-12 text-sm font-normal shadow-[0_8px_35px_#00000005] outline-none focus:border-[#30b38b] focus:ring-2 focus:ring-[#30b38b]/20"
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Enter your Password"
                  required
                  minlength="8"
                  autocomplete="current-password" />
                <img
                  class="pointer-events-none absolute right-5 top-1/2 h-5 w-5 -translate-y-1/2"
                  src="./assets/images/fi-rr-lock.png"
                  alt=""
                  aria-hidden="true" />
              </span>
            </label>
            <a
              href="./reset-password.html"
              class="float-right text-sm font-semibold text-[#30b38b]"
              >Forgot?</a
            ><button
              class="inline-flex items-center justify-center rounded-lg bg-[#30b38b] px-7 py-3 font-semibold text-white hover:bg-[#269775] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#30b38b] transition w-full mt-4"
              type="submit"
            >
              Login
            </button>
            <p
              id="message"
              role="status"
              class="mt-4 text-sm text-[#b73d52]"
            ></p>
          </form>
          <p class="mt-6 text-sm text-neutral-400">
            Don't Have an Account?
            <a class="ml-2 font-semibold text-[#30b38b]" href="./register.html"
              >Register</a
            >
          </p>
        </section>
      </div>

    </main>
    <script src="./script.js"></script>
    <script src="./login.js"></script>
  </body>
</html>
