<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Accounts | Reen Bank</title>
    <link rel="stylesheet" href="./output.css">
    
    
  </head>
  <body class="m-0 font-sans text-[#252725] antialiased">
    <div class="relative min-h-screen bg-[#f5fbf8]">
      <div class="relative flex min-h-screen flex-col lg:flex-row">
        <aside
          class="flex shrink-0 flex-col p-6 lg:fixed lg:inset-y-0 lg:w-67.5 lg:px-8 lg:py-12">
          <a
            href="index.html"
            class="inline-flex items-center gap-4 text-2xl font-bold whitespace-nowrap"
            aria-label="Reen Bank home">
            <span class=" px-1.5 pb-1 text-3xl leading-none">
              <img src="./assets/images/logo.png" alt="Reen Bank Logo">
            </span>
          </a>   
          <nav class="mt-7 flex flex-wrap gap-1 lg:mt-20 lg:flex-col">
            <a
              href="./dashboard.html"
              class="flex items-center gap-6 rounded-lg px-3 py-4 text-neutral-600 hover:bg-[#d3f2e7]"
              ><img src="./assets/images/fi-rr-apps.png" alt="Overview Logo">Overview</a
            ><a
              href="./accounts.html"
              class="flex items-center gap-6 rounded-lg px-3 py-4 font-semibold text-[#30b38b]"
              ><img src="./assets/images/fi-sr-credit-card.png" alt="Accounts Logo">Accounts</a
            ><a
              href="./transactions.html"
              class="flex items-center gap-6 rounded-lg px-3 py-4 text-neutral-600 hover:bg-[#d3f2e7]"
              ><img src="./assets/images/Group 19.png" alt="Transactions Logo">Transactions</a
            ><a
              href="./profile.html"
              class="flex items-center gap-6 rounded-lg px-3 py-4 text-neutral-600 hover:bg-[#d3f2e7]"
              ><img src="./assets/images/fi-rr-user.png" alt="Profile Logo">Profile</a
            >
          </nav>
          <a
            href="./logout.html"
            class="mt-auto hidden items-center gap-8 p-3 pt-12 text-neutral-600 lg:flex"
            ><img src="./assets/images/fi-rr-arrow-left.png" alt="Logout">Logout</a
          >
        </aside>
        <main class="min-w-0 flex-1 px-6 pb-12 lg:ml-67.5 lg:px-10">
          <header
            class="mb-14 flex flex-wrap items-center justify-between gap-6 py-8 lg:py-12">
            <h1 class="text-3xl font-semibold">Accounts</h1>
            <div class="text-center">
              <p data-user-name class="text-sm text-[#30b38b]">
                Maureen Oguche
              </p>
              <p class="mt-1 text-2xl font-bold tracking-tight">1234567890</p>
            </div>
            <div class="flex items-center gap-5">
              <label class="flex items-center gap-3 text-neutral-500"
                ><span><img src="./assets/images/fi-rr-search.png" alt="Search Icon"></span
                ><input
                  id="search"
                  aria-label="Search transactions"
                  placeholder="Search"
                  class="w-28 bg-transparent text-sm outline-none focus:border-b focus:border-[#30b38b]" /></label
              ><button
                id="notifications"
                aria-label="Notifications"
                class="text-2xl">
                <img src="./assets/images/notification bell.png" alt="Notifications">
              </button
              ><a href="./profile.html"
                ><img
                  src="./assets/images/Ellipse 32.png"
                  alt="Profile"
                  class="size-11 rounded-full object-cover" /></a
              ><a href="./logout.html" class="text-sm lg:hidden">Logout</a>
            </div>
          </header>
          <div
            id="notice"
            role="status"
            class="mb-4 text-sm text-[#30b38b]">
          </div>
          <div id="account-cards" class="grid gap-5 sm:grid-cols-3"></div>
          <section class="mt-10 rounded-xl bg-white/90 p-8">
            <div class="flex flex-wrap items-center justify-between gap-6">
              <div>
                <p class="text-sm text-[#30b38b]">Available balance</p>
                <h2
                  class="mt-3 text-4xl font-semibold"
                  data-money="balance">
                </h2>
              </div>
              <div class="flex gap-3">
                <a
                  href="./fund-wallet.html"
                  class="inline-flex items-center justify-center rounded-lg bg-[#30b38b] px-7 py-3 font-semibold text-white hover:bg-[#269775] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#30b38b] transition"
                  >Fund Wallet</a
                ><a
                  href="./withdraw.html"
                  class="inline-flex items-center justify-center rounded-lg border border-[#30b38b] px-7 py-3 font-semibold text-[#30b38b] hover:bg-white/50"
                  >Withdraw</a
                >
              </div>
            </div>
            <p class="mt-7 text-sm text-neutral-400">
              Account number 1234567890
            </p>
          </section>
          <section class="mt-10">
            <h2 class="mb-5 text-xl font-semibold">Create a savings account</h2>
            <form id="add-account" class="flex max-w-xl flex-wrap gap-3">
              <input
                id="account-name"
                aria-label="Account name"
                required
                maxlength="40"
                placeholder="e.g. School Savings"
                class=" w-full rounded-xl border border-neutral-400 bg-white px-5 py-4 text-sm shadow-[0_8px_35px_#00000005] outline-none focus:border-[#30b38b] focus:ring-2 focus:ring-[#30b38b]/20 mt-0 min-w-0 flex-1"
              /><button
                class="inline-flex items-center justify-center rounded-lg bg-[#30b38b] px-7 py-3 font-semibold text-white hover:bg-[#269775] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#30b38b] transition">
                Add account
              </button>
            </form>
            <p
              id="message"
              role="status"
              class="mt-4 text-sm text-[#b73d52]"
            ></p>
          </section>
          <div class="mt-12">
            <section>
              <div class="mb-6 flex items-center justify-between">
                <h2 class="text-xl font-semibold">Transactions</h2>
                <a
                  href="./transactions.html"
                  aria-label="View all transactions"
                  class="flex gap-5 text-[#30b38b]"
                  >View All<img src="./assets/images/Vector.png" alt="Right arrow"></a
                >
              </div>
              <select
                id="status-filter"
                aria-label="Filter by status"
                class="rounded-lg border border-neutral-200 bg-white p-3 text-sm">
                <option>All statuses</option>
                <option>Completed</option>
                <option>Pending</option>
                <option>Canceled</option>
             </select>
          </div>
          <div class="mt-6 overflow-x-auto">
            <table class="w-full min-w-175 text-left text-sm">
              <thead class="text-neutral-500">
                <tr>
                  <th class="p-4">Type</th>
                  <th>Name</th>
                  <th>Method</th>
                  <th>Date</th>
                  <th>Amount</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="transaction-table"></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <script src="./script.js"></script>
    <script src="./accounts.js"></script>
    <script src="./transactions.js"></script>
  </body>
</html>
