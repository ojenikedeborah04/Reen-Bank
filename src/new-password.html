<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Enter new Password | Reen Bank</title>
    <link rel="stylesheet" href="./output.css">
    
  </head>
  <body class="m-0 font-sans text-[#252725] antialiased">
    <main
      class="flex min-h-screen items-center justify-center bg-[#d8f3e9] p-5"
    >
      <section
        class="relative w-full max-w-170 rounded-[30px] bg-white p-8 shadow-[0_0_90px_35px_#30b38b50] sm:p-16"
      >
        <a
          href="./dashboard.html"
          class="absolute right-6 top-5 text-xl text-neutral-400"
          aria-label="Close"
          >×</a
        >
        <h2 class="mb-10 text-3xl font-semibold text-[#30b38b]">
          Enter new Password
        </h2>
        <form id="password-form">
          <label class="mb-5 block text-sm font-semibold" for="password">
            New Password
            <span class="relative mt-2 block">
              <input
                class="w-full rounded-xl border border-neutral-400 bg-white px-5 py-4 pr-12 text-sm font-normal shadow-[0_8px_35px_#00000005] outline-none focus:border-[#30b38b] focus:ring-2 focus:ring-[#30b38b]/20"
                id="password"
                name="password"
                type="password"
                placeholder="Enter your Password"
                required
                minlength="8"
                autocomplete="new-password" />
              <img
                class="pointer-events-none absolute right-5 top-1/2 h-5 w-5 -translate-y-1/2"
                src="./assets/images/fi-rr-lock.png"
                alt=""
                aria-hidden="true" />
            </span>
          </label>
          <label class="mb-5 block text-sm font-semibold" for="confirm">
            Retype Password
            <span class="relative mt-2 block">
              <input
                class="w-full rounded-xl border border-neutral-400 bg-white px-5 py-4 pr-12 text-sm font-normal shadow-[0_8px_35px_#00000005] outline-none focus:border-[#30b38b] focus:ring-2 focus:ring-[#30b38b]/20"
                id="confirm"
                name="confirm"
                type="password"
                placeholder="Retype your Password"
                required
                minlength="8"
                autocomplete="new-password" />
              <img
                class="pointer-events-none absolute right-5 top-1/2 h-5 w-5 -translate-y-1/2"
                src="./assets/images/fi-rr-lock.png"
                alt=""
                aria-hidden="true" />
            </span>
          </label>
          <button
            class="inline-flex items-center justify-center rounded-lg bg-[#30b38b] px-7 py-3 font-semibold text-white hover:bg-[#269775] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#30b38b] transition w-full mt-4"
            type="submit"
          >
            Change Password
          </button>
        </form>
        <p id="message" role="status" class="mt-4 text-sm text-[#b73d52]"></p>
        
      </section>
    </main>
    <script src="./script.js"></script>
    <script src="./new-password.js"></script>
  </body>
</html>
